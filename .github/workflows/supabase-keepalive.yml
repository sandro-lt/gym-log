# Keeps the free Supabase project from pausing after 7 days without activity
# (e.g. during a training break): a small request to the database every 3 days.
# The request is made without signing in, so it is refused (401) – but it still reaches
# the database, which is what counts as activity. Only a server error or no answer fails.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'   # 06:17 UTC every 3 days
  workflow_dispatch:           # "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: sb_publishable_5uAClQdAMLVEYt6Xw3M8fw_0gBj1_dL" \
            "https://vdgeuxkgsonfukhmhphi.supabase.co/rest/v1/records?select=id&limit=1")
          echo "HTTP $status"
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then exit 1; fi
