<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Log</title>
  <meta name="theme-color" content="#0d0f12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="main"></main>

  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Add exercise">
    <div class="body"></div>
  </div>

  <div id="editor" class="editor" role="dialog" aria-modal="true" aria-label="Edit exercise">
    <div class="body"></div>
  </div>

  <div id="exhist" class="editor detail" role="dialog" aria-modal="true" aria-label="Exercise history">
    <div class="body"></div>
  </div>

  <div id="detail" class="editor detail" role="dialog" aria-modal="true" aria-label="Workout details">
    <div class="body"></div>
  </div>

  <div id="plan" class="editor detail" role="dialog" aria-modal="true" aria-label="Edit plan">
    <div class="body"></div>
  </div>

  <div id="picker" class="picker" role="dialog" aria-modal="true" aria-label="Pick a value">
    <div class="body"></div>
  </div>

  <div id="rest" role="timer" aria-live="off"></div>
  <div id="update" role="status"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar">
    <button data-tab="training" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>Training</span>
    </button>
    <button data-tab="charts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 19.5h17"/><path d="M4 16l5-5.5 4 3.5 7-8"/><path d="M16.5 6H20v3.5"/></svg>
      <span>Charts</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/><circle cx="12" cy="12" r="6.8"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <script src="db.js"></script>
  <script src="body.js"></script>
  <script src="strength.js"></script>
  <script src="library.js"></script>
  <script src="app.js"></script>
  <script src="swap.js"></script>
  <script src="records.js"></script>
  <script src="rest.js"></script>
  <script src="plans.js"></script>
  <script src="charts.js"></script>
  <script src="settings.js"></script>
</body>
</html>
